# 커밋·풀 리퀘스트마다 검사: 빌드 → 린트 → 타입 → 스키마 → 데스크톱 규칙 → 화면 동작 → 데스크톱 실행 → 회귀
# 회귀 검사: 서버 크롬은 버전이 계속 바뀌므로 결정론·하얀 화면·페이지 오류만 실패로 보고, 기준 프레임과의 차이는 보고만 한다
# (RLAB_GOLDEN=report, 차이 이미지는 실행 결과의 regress-diff). 기준 프레임 일치는 로컬 `npm test`에서 엄격하게.
name: 검사
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 준비 (패키지, 가상 화면, FFmpeg)
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg > /dev/null
          google-chrome --version
      - name: 빌드
        run: node build.mjs
      - name: 빌드 결과가 저장소와 같은지 (app/RESONANCE_LAB.html 커밋 누락 확인)
        run: git diff --stat --exit-code app/RESONANCE_LAB.html
      - name: 린트
        run: npx eslint .
      - name: 타입 검사
        run: npx tsc -p tsconfig.json
      - name: 스키마 검사
        run: node tests/schema.mjs
      - name: 데스크톱 규칙 검사
        run: node tests/desktop.mjs
      - name: 화면 동작 검사
        run: node tests/ui.mjs
      - name: 데스크톱 실행 검사 (Electron)
        run: |
          npm i --no-save --no-audit --no-fund electron@33.2.1
          ELECTRON_PATH="$PWD/node_modules/electron/dist/electron" FFMPEG_PATH="$(which ffmpeg)" xvfb-run -a node tests/desktop_e2e.mjs
      - name: 회귀 검사 (45장 — 결정론·렌더 이상, 기준 차이는 보고)
        run: RLAB_LOOSE=1 RLAB_GOLDEN=report RLAB_DIFF_DIR=regress-diff node tests/regress.mjs
      - name: 회귀 차이 이미지 올리기
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regress-diff
          path: regress-diff
          if-no-files-found: ignore
